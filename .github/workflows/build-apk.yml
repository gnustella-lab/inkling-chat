name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Install NDK and CMake
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: InklingChat-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          compression-level: 0

      - name: Build release APK (unsigned)
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Sign release APK with generated key
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/inkling.keystore" \
            -storepass android -keypass android -alias inkling \
            -dname "CN=Inkling Chat, O=InklingChat" -validity 10000 \
            -keyalg RSA -keysize 2048
          BUILD_TOOLS="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign" -f 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            "$RUNNER_TEMP/app-release-aligned.apk"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/inkling.keystore" --ks-pass pass:android \
            --out app/build/outputs/apk/release/app-release-signed.apk \
            "$RUNNER_TEMP/app-release-aligned.apk"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: InklingChat-release-signed
          path: app/build/outputs/apk/release/app-release-signed.apk
          compression-level: 0
